services:
  web:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DEBUG: "False"
    ports:
      - "8000:8000"
    volumes:
      - static_files:/app/staticfiles
      - media_files:/app/media
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - >
          python -c "import socket; s=socket.socket();
          s.settimeout(2); s.connect(('127.0.0.1',8000)); s.close()"
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 20s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  celery_worker:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DEBUG: "False"
    command: celery -A config worker -l info --concurrency=2
    volumes:
      - media_files:/app/media
    depends_on:
      web:
        condition: service_healthy
      redis:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  celery_beat:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DEBUG: "False"
    command: celery -A config beat -l info
    volumes:
      - beat_data:/app/celerybeat
    depends_on:
      web:
        condition: service_healthy
      redis:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  static_files:
  media_files:
  redis_data:
  beat_data: